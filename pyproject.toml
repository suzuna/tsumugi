[project]
name = "tsumugi"
version = "0.1.0"
description = "A tiny micro-like terminal text editor with an overlay file explorer"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
tsumugi = "tsumugi.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumugi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
